<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" fill="none" role="img">
<title>Daily Artifacts</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1124"/><stop offset="1" stop-color="#060914"/></linearGradient>
  <linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8B5CF6" stop-opacity=".6"/><stop offset=".45" stop-color="#1F2B52" stop-opacity=".7"/><stop offset="1" stop-color="#22D3EE" stop-opacity=".5"/></linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" fill-opacity=".055"/></pattern>
  <clipPath id="clip"><rect width="1200" height="300" rx="20"/></clipPath>
  <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="48"/></filter>
  
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A78BFA"/><stop offset=".5" stop-color="#60A5FA"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
  <linearGradient id="brandV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
  <linearGradient id="kite" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F472B6"/><stop offset=".5" stop-color="#FB923C"/><stop offset="1" stop-color="#FBBF24"/></linearGradient>
</defs>
<style>text{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif}.mono{font-family:'JetBrains Mono', 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace}.kite{transform-origin:1000px 205px;animation:sway 5s ease-in-out infinite}@keyframes sway{0%,100%{transform:rotate(-7deg) translate(0,0)}50%{transform:rotate(6deg) translate(10px,-10px)}}
    .tw{animation:tw 3s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}</style>
<g clip-path="url(#clip)">
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  
  
  <circle cx="980" cy="60" r="220" fill="#DB2777" opacity=".2" filter="url(#blur)"/>
  <circle cx="1120" cy="300" r="180" fill="#F59E0B" opacity=".14" filter="url(#blur)"/>
  <rect x="40" y="36" width="56" height="56" rx="16" fill="#F472B6" fill-opacity=".12" stroke="#F472B6" stroke-opacity=".45"/>
  <g transform="translate(54 50) scale(1.1666666666666667)" fill="none" stroke="#F472B6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 11h4M8 9v4M15 12h.01M18 10h.01"/><rect x="2" y="6" width="20" height="12" rx="4"/></g>
  <text x="114" y="66" font-size="26" font-weight="700" fill="#EEF1FA">Daily Artifacts</text>
  <g transform="translate(114 78) scale(0.5833333333333334)" fill="none" stroke="#6B7699" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></g><text x="134" y="90" class="mono" font-size="13" fill="#6B7699">usamaDev326/artifacts</text>
  <g><rect x="336.70000000000005" y="44" width="123.6" height="26" rx="13" fill="#34D399" fill-opacity=".1" stroke="#34D399" stroke-opacity=".4"/>
     <circle cx="352.70000000000005" cy="57" r="3.5" fill="#34D399"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
     <text x="362.70000000000005" y="61.5" class="mono" font-size="11" letter-spacing="1" fill="#34D399">SHIPS DAILY</text></g>
  <text x="40" y="136" font-size="17" fill="#A6AFCF">A new self-contained browser game or interactive page, shipped every day.</text><text x="40" y="162" font-size="17" fill="#A6AFCF">Canvas physics, Web Audio and a desi touch.</text>
  <g transform="translate(40 198)">
    <rect width="90" height="28" rx="14" fill="#F472B6" fill-opacity=".1" stroke="#F472B6" stroke-opacity=".38"/>
    <circle cx="16" cy="14" r="3.5" fill="#F472B6"/>
    <text x="27" y="18.68" font-size="13" fill="#EEF1FA" fill-opacity=".92">Bo Kata</text>
  </g><g transform="translate(136.18 198)">
    <rect width="130" height="28" rx="14" fill="#FBBF24" fill-opacity=".1" stroke="#FBBF24" stroke-opacity=".38"/>
    <circle cx="16" cy="14" r="3.5" fill="#FBBF24"/>
    <text x="27" y="18.68" font-size="13" fill="#EEF1FA" fill-opacity=".92">Load Shedding</text>
  </g><g transform="translate(272.40000000000003 198)">
    <rect width="130" height="28" rx="14" fill="#FB923C" fill-opacity=".1" stroke="#FB923C" stroke-opacity=".38"/>
    <circle cx="16" cy="14" r="3.5" fill="#FB923C"/>
    <text x="27" y="18.68" font-size="13" fill="#EEF1FA" fill-opacity=".92">Lantern Drift</text>
  </g><g transform="translate(408.62000000000006 198)">
    <rect width="114" height="28" rx="14" fill="#8B5CF6" fill-opacity=".1" stroke="#8B5CF6" stroke-opacity=".38"/>
    <circle cx="16" cy="14" r="3.5" fill="#8B5CF6"/>
    <text x="27" y="18.68" font-size="13" fill="#EEF1FA" fill-opacity=".92">Maze Quest</text>
  </g><g transform="translate(528.72 198)">
    <rect width="138" height="28" rx="14" fill="#38BDF8" fill-opacity=".1" stroke="#38BDF8" stroke-opacity=".38"/>
    <circle cx="16" cy="14" r="3.5" fill="#38BDF8"/>
    <text x="27" y="18.68" font-size="13" fill="#EEF1FA" fill-opacity=".92">Moonlight Moth</text>
  </g><g transform="translate(672.74 198)">
    <rect width="116" height="28" rx="14" fill="#2DD4BF" fill-opacity=".1" stroke="#2DD4BF" stroke-opacity=".38"/>
    <circle cx="16" cy="14" r="3.5" fill="#2DD4BF"/>
    <text x="27" y="18.68" font-size="13" fill="#EEF1FA" fill-opacity=".92">Paper Skies</text>
  </g>
  <text x="40" y="272" class="mono" font-size="13" fill="#F472B6">play them → github.com/usamaDev326/artifacts</text>

  <path d="M1000 205C1040 250 1060 270 1150 300" stroke="#fff" stroke-opacity=".35" stroke-width="1.2" fill="none"/>
  <g class="kite">
    <path d="M1000 60L1046 128L1000 205L954 128Z" fill="url(#kite)"/>
    <path d="M1000 60V205M954 128H1046" stroke="#0B1124" stroke-opacity=".45" stroke-width="2"/>
    <path d="M1000 205c-8 14 8 22 0 36s8 22 0 34" stroke="#FBBF24" stroke-width="2.5" fill="none" class="tail"/>
    <path d="M994 228l6 6 6-6M994 256l6 6 6-6" stroke="#F472B6" stroke-width="2.5" fill="none"/>
  </g>
  <circle cx="880" cy="70" r="1.6" fill="#fff" class="tw" style="animation-delay:0s"/><circle cx="1120" cy="110" r="1.6" fill="#fff" class="tw" style="animation-delay:0.6s"/><circle cx="900" cy="220" r="1.6" fill="#fff" class="tw" style="animation-delay:1.2s"/><circle cx="1150" cy="50" r="1.6" fill="#fff" class="tw" style="animation-delay:1.7999999999999998s"/><circle cx="840" cy="150" r="1.6" fill="#fff" class="tw" style="animation-delay:2.4s"/>
</g>
<rect x=".75" y=".75" width="1198.5" height="298.5" rx="19.25" stroke="url(#border)" stroke-width="1.5"/>
</svg>
