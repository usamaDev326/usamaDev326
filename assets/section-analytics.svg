<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="100" viewBox="0 0 1200 100" fill="none" role="img">
<title>GitHub Analytics</title>
<defs>
  <linearGradient id="deep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C3AED"/><stop offset=".55" stop-color="#2A78D6"/><stop offset="1" stop-color="#0E9FB8"/></linearGradient>
  <linearGradient id="comet" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2A78D6" stop-opacity="0"/><stop offset=".8" stop-color="#22D3EE"/><stop offset="1" stop-color="#fff"/></linearGradient>
  <linearGradient id="rule" x1="394" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#8B949E" stop-opacity=".5"/><stop offset="1" stop-color="#8B949E" stop-opacity="0"/></linearGradient>
  <clipPath id="lane"><rect x="394" y="64" width="806" height="8"/></clipPath>
</defs>
<style>text{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif}.mono{font-family:'JetBrains Mono', 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace}</style>
<circle cx="24" cy="60" r="22" fill="#7C3AED" fill-opacity=".08" stroke="url(#deep)" stroke-width="1.5"/>
<text x="24" y="65.5" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="url(#deep)">06</text>
<text x="66" y="44" class="mono" font-size="13" letter-spacing="2.5" fill="#8B949E">// ACTIVITY — refreshed daily by a workflow</text>
<text x="65" y="82" font-size="34" font-weight="700" letter-spacing="-.5" fill="url(#deep)">GitHub Analytics</text>
<path d="M394 68.5H1196" stroke="url(#rule)" stroke-width="1.5"/>
<g clip-path="url(#lane)"><rect y="67" width="160" height="3" rx="1.5" fill="url(#comet)"><animate attributeName="x" from="234" to="1200" dur="4s" begin="1.85s" repeatCount="indefinite"/></rect></g>
</svg>
