  <g class="w1"><path d="M0 168q75 -16 150 0t150 0q75 -16 150 0t150 0q75 -16 150 0t150 0q75 -16 150 0t150 0q75 -16 150 0t150 0q75 -16 150 0t150 0q75 -16 150 0t150 0q75 -16 150 0t150 0V220H0Z" fill="url(#wv1)"/></g>
