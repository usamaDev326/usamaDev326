<style>text{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif}.mono{font-family:'JetBrains Mono', 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace}.w1{animation:wv 18s linear infinite}.w2{animation:wv 26s linear infinite reverse}.w3{animation:wv 14s linear infinite}
    @keyframes wv{from{transform:translateX(0)}to{transform:translateX(-1200px)}}</style>
